apiVersion: v1
kind: Service
metadata:
  name: s3-backend
spec:
  selector:
    app: s3-backend
  ports:
    - port: 8333
---
apiVersion: v1
kind: Pod
metadata:
  name: s3-fault
  labels:
    app: s3-fault
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
  containers:
    - name: proxy
      image: oss-s3-fault-proxy:local
      imagePullPolicy: Never
      readinessProbe:
        tcpSocket:
          port: 8333
      volumeMounts:
        - name: mode
          mountPath: /tmp
  volumes:
    - name: mode
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3-fault
  ports:
    - port: 8333
