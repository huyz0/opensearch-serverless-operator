apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-serverless-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch-serverless-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-serverless-operator
    spec:
      serviceAccountName: opensearch-serverless-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: opensearch-serverless-operator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --watch-namespace=$(WATCH_NAMESPACE)
            - --development-create-gated-pods
            - --development-release-gated-pods
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
