apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../operator-dev
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: opensearch-serverless-operator
    path: deployment.patch.yaml
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: opensearch-serverless-operator
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: [discovery.k8s.io]
          resources: [endpointslices]
          verbs: [list]
