# Incomplete design draft. Do not install in a cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: opensearchserverlesses.serverless.opensearch.org
spec:
  group: serverless.opensearch.org
  scope: Namespaced
  names:
    plural: opensearchserverlesses
    singular: opensearchserverless
    kind: OpenSearchServerless
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [image, serviceAccountName, storage, pools]
              properties:
                image: {type: string, pattern: '^.+@sha256:[a-f0-9]{64}$'}
                serviceAccountName: {type: string, minLength: 1}
                storage:
                  type: object
                  required: [type]
                  properties:
                    type: {type: string, enum: [s3, fs]}
                    bucket: {type: string, minLength: 1}
                    region: {type: string, minLength: 1}
                    endpoint: {type: string}
                    pathStyleAccess: {type: boolean}
                    repositoryRef:
                      type: object
                      required: [name]
                      properties:
                        name: {type: string, minLength: 1}
                    credentials:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                pools:
                  type: object
                  properties:
                    search: {type: object, x-kubernetes-preserve-unknown-fields: true}
                    ingest: {type: object, x-kubernetes-preserve-unknown-fields: true}
                availability: {type: object, x-kubernetes-preserve-unknown-fields: true}
                rollout: {type: object, x-kubernetes-preserve-unknown-fields: true}
                runtime: {type: object, x-kubernetes-preserve-unknown-fields: true}
                tls: {type: object, x-kubernetes-preserve-unknown-fields: true}
                security: {type: object, x-kubernetes-preserve-unknown-fields: true}
                snapshots:
                  type: object
                  properties:
                    repository: {type: string, minLength: 1}
                plugins:
                  type: array
                  items:
                    type: object
                    required: [name, artifact]
                    properties:
                      name: {type: string, minLength: 1}
                      artifact: {type: string, pattern: '^.+@sha256:[a-f0-9]{64}$'}
                      registryCredentialsRef:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string, minLength: 1}
                      roles:
                        type: array
                        items: {type: string, enum: [search, ingest]}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
