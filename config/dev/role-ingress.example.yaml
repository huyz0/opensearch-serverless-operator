apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-role-routes
spec:
  ingressClassName: platform-ingress
  rules:
    - host: search.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog-search
                port:
                  number: 9200
    - host: index.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog-index
                port:
                  number: 9200
