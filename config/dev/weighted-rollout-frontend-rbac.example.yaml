# Set the Gateway namespace, exact frontend Service name, and operator namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensearch-serverless-weighted-frontend
  namespace: envoy-gateway-system
rules:
  - apiGroups: ['']
    resources: [services]
    resourceNames: [catalog-envoy]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensearch-serverless-weighted-frontend
  namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensearch-serverless-weighted-frontend
subjects:
  - kind: ServiceAccount
    name: opensearch-serverless-operator
    namespace: operator-development
