              rule: '!has(self.rollout) || !has(self.rollout.candidate) || !has(self.rollout.candidate.runtimeOverride)
                || (self.rollout.strategy == ''BlueGreen'' && has(self.rollout.rollbackWindow)
                && size(self.rollout.rollbackWindow) > 0)'
            - message: pools support only search and ingest, and warm readiness belongs
                to search
              optionalOldSelf: true
              rule: '(oldSelf.hasValue() && self.pools == oldSelf.value().pools) ||
                (size(self.pools) == ((''search'' in self.pools ? 1 : 0) + (''ingest''
                in self.pools ? 1 : 0)) && (!(''ingest'' in self.pools) || ((!has(self.pools[''ingest''].warmOnJoin)
                || !self.pools[''ingest''].warmOnJoin) && !has(self.pools[''ingest''].warmReadiness)
                && !has(self.pools[''ingest''].coldStartPolicy))))'
